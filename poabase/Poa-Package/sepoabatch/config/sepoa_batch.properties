#######################################################################################
# Database
#######################################################################################
# Database Options
sepoa.app.name = TOMCAT
sepoa.app.use = false
sepoa.app.dbcp = true

# DBCP Options
sepoa.db.pool.checkinterval = 1000
sepoa.db.pool.size.min = 20
sepoa.db.pool.size.max = 30
sepoa.db.pool.trace = true

sepoa.dbcp.pool.names=dbcp

sepoa.dbcp.driver=oracle.jdbc.driver.OracleDriver
sepoa.dbcp.uri=
sepoa.dbcp.user=
sepoa.dbcp.password=
sepoa.dbcp.validationQuery=select 'x' from dual
sepoa.dbcp.maxtotal=10
sepoa.dbcp.maxidle=1
sepoa.dbcp.minidle=1
sepoa.dbcp.maxwaitmillis=5

# F/W DB Options
sepoa.db.vendor = ORACLE
#sepoa.db.vendor = MSSQL
#sepoa.db.vendor = POSTGRE
sepoa.db.owner = dbo
sepoa.db.query.xml.path = service_query/oracle
#sepoa.db.query.xml.path = service_query/mssql
#sepoa.db.query.xml.path = service_query/postgre
sepoa.database.encoding = UTF-8

#######################################################################################
# WAS
#######################################################################################
# Logger
sepoa.userlog.use.flag = true
sepoa.userlog.no_use.program = CO_012.getEPCodeSearch;CO_012.getEPCodeMaster;CO_012.getCodeMaster;CO_012.getCodeSearch;CO_012.getCodeFlag;CO_012.getCodeColumn;CO_004.setLogout;CO_004.setlogin;CO_011.checkUrl;CO_005.getUserMenu;CO_005.getUserMenuTree;CO_004.setLoginProcess

# Logger
sepoa.logger.dir = D:/Dev/Log/batch
sepoa.logger.driver = sepoa.fw.log.HouseCodeLoggerWriter
sepoa.logger.autoflush = true

# Log file split unit
# DAYS, TIMES
sepoa.logger.sc=DAYS

# Logging Trace Level
sepoa.logger.sys.trace = true
sepoa.logger.err.trace = true
sepoa.logger.warn.trace = true
sepoa.logger.info.trace = true
sepoa.logger.debug.trace = true
sepoa.logger.dbwrap.trace = true
sepoa.logger.dev.trace = true

# Encoding
sepoa.was.encoding = UTF-8

#######################################################################################
# Web Default
#######################################################################################
# SepoaFormater
sepoa.separator.ap_line = |@
sepoa.separator.ap_field = ^*
sepoa.separator.field = ~
sepoa.separator.line = _

sepoa.view.rowcount = 50000
sepoa.serialize.rowcount = 1000

sepoa.sqlmanager.history =true

# Develop Flag
sepoa.server.development.flag = true

# Encoding
sepoa.encodingset =UTF-8

sepoa.default.house_code=000

#######################################################################################
# Configration
#######################################################################################
# Service Config
sepoa.service.checkinterval =
sepoa.service.lifetime =
sepoa.service.pool.size.max = 100

# Directory
sepoa.license.root=D:/Dev/07.license
sepoa.work.base= D:/Dev/03.WorkSpace/Poa-BASE-builder
sepoa.service.root = %WORK_BASE%/poabase/Poa-Package/
sepoa.doc.base = %WORK_BASE%/poabase/WebContent

# House Code
sepoa.use.housecode = true
localhost.house_code = 000
#twice.sepoa.co.kr.house_code = 010
#test.sepoa.co.kr.house_code = 020

#sepoa.010.config.file = D:/Dev/03.WorkSpace/Poa-STD-SUXv4/poastd/Poa-Package/sepoaconfig/sepoa.010.properties
#sepoa.020.config.file = D:/Dev/03.WorkSpace/Poa-STD-SUXv4/poastd/Poa-Package/sepoaconfig/sepoa.020.properties

# DocNumber (Year type : FULL or SHORT)
sepoa.document.generation.year.type = SHORT

