<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style type="text/css">
        .sepoa_email_top {
            background-color: #48555C;
            color: #FFFFFF;
            height: 50px;
            text-align: left;
            font-size: 16px;
            font-family: 'Malgun Gothic' !important;
            line-height: 50px;
        }
        
        .sepoa_email_center {

            color: #48555C;

        .sepoa_email_center_remark {

        .sepoa_email_bottom {

            color: #FFFFFF;
            height: 50px;
            font-size: 13px;
            text-align: center;
            font-family: 'Malgun Gothic' !important;
            line-height: 50px;
        }
        
        .sepoa_email_button {
            height: 50px;
            background-color: #48555C;
            color: #FFFFFF;
            font-size: 13px;
            text-align: center;
            font-family: 'Malgun Gothic' !important;
            line-height: 50px;
        }
        
        .sepoa_email_button:hover {
            background-color: #37444B;
            color: #FFFFFF;
            cursor: pointer;
        }
        
        a {
            text-decoration: none !important;
        }
