sepoa.attach.download    = D:\Dev\attach

sepoa.attach.upload.CBO=$config{sepoa.work.base}/poaseal_cbo/000/CBO-Package/design/
sepoa.attach.download.CBO=$config{sepoa.work.base}/poaseal_cbo/000/CBO-Package/design/

