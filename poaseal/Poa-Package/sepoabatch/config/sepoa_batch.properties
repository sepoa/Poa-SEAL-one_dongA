#######################################################################################
# Database
#######################################################################################
# Database Options
sepoa.app.name = TOMCAT
sepoa.app.use = false
sepoa.app.dbcp = true

# DBCP Options
sepoa.db.pool.checkinterval = 1000
sepoa.db.pool.size.min = 20
sepoa.db.pool.size.max = 30
sepoa.db.pool.trace = true

sepoa.dbcp.pool.names=dbcp

sepoa.dbcp.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
sepoa.dbcp.uri=jdbc:sqlserver://tdb.sepoa.co.kr:1433;SelectMethod=direct;DatabaseName=poaseal_one;sendStringParametersAsUnicode=false
sepoa.dbcp.user=poaseal_one
sepoa.dbcp.password=poaseal_one01
sepoa.dbcp.validationQuery=select 'x'
sepoa.dbcp.maxtotal=10
sepoa.dbcp.maxidle=1
sepoa.dbcp.minidle=1
sepoa.dbcp.maxwaitmillis=5

# F/W DB Options
#sepoa.db.vendor = ORACLE
sepoa.db.vendor = MSSQL
#sepoa.db.vendor = POSTGRE
sepoa.db.owner = dbo
#sepoa.db.query.xml.path = service_query/oracle
sepoa.db.query.xml.path = service_query/mssql
#sepoa.db.query.xml.path = service_query/postgre
sepoa.database.encoding = UTF-8

#######################################################################################
# WAS
#######################################################################################
# Logger
sepoa.userlog.use.flag = true
sepoa.userlog.no_use.program = CO_012.getEPCodeSearch;CO_012.getEPCodeMaster;CO_012.getCodeMaster;CO_012.getCodeSearch;CO_012.getCodeFlag;CO_012.getCodeColumn;CO_004.setLogout;CO_004.setlogin;CO_011.checkUrl;CO_005.getUserMenu;CO_005.getUserMenuTree;CO_004.setLoginProcess

# Logger
sepoa.logger.dir = D:/Dev/Log/batch
sepoa.logger.driver = sepoa.fw.log.HouseCodeLoggerWriter
sepoa.logger.autoflush = true

# Log file split unit
# DAYS, TIMES
sepoa.logger.sc=DAYS

# Logging Trace Level
sepoa.logger.sys.trace = true
sepoa.logger.err.trace = true
sepoa.logger.warn.trace = true
sepoa.logger.info.trace = true
sepoa.logger.debug.trace = true
sepoa.logger.dbwrap.trace = true
sepoa.logger.dev.trace = true

# Encoding
sepoa.was.encoding = UTF-8

